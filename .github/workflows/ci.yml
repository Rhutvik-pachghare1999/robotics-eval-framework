name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e . && pip install pytest

      - name: Provenance guardrail self-check (must reject invented results)
        run: python scripts/selfcheck.py

      - name: Validate all committed result manifests
        run: python scripts/validate_results.py

      - name: Adapters must hard-fail until verified
        run: pytest tests/ -v
