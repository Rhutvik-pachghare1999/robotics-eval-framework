[project]
name = "robotics-eval-framework"
version = "0.1.0"
description = "Reproducible robotics evaluation with enforced evidence-class provenance."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.2"]
test = ["pytest>=7.0", "numpy>=1.20", "scipy>=1.7", "scikit-learn>=1.0", "h5py>=3.0"]

[tool.setuptools]
packages = ["adapters"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
